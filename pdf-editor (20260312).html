async function createPasswordFreeDocument(){
  const{PDFDocument}=PDFLib;
  if(!isPasswordProtected)return PDFDocument.load(pdfBytes);

  // pdf-lib cannot decrypt encrypted PDFs. pdf.js already has an unlocked
  // document, so rebuild each page from that view before applying edits. A
  // newly-created PDF has no encryption dictionary or source password.
  const doc=await PDFDocument.create();
  for(let pn=1;pn<=totalPages;pn++){
    const sourcePage=await pdfDoc.getPage(pn);
    const outputViewport=sourcePage.getViewport({scale:1,rotation:0});
    const renderViewport=sourcePage.getViewport({scale:2,rotation:0});
    const canvas=document.createElement('canvas');
    canvas.width=Math.ceil(renderViewport.width);canvas.height=Math.ceil(renderViewport.height);
    const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    await sourcePage.render({canvasContext:ctx,viewport:renderViewport}).promise;
    const image=await doc.embedJpg(canvas.toDataURL('image/jpeg',.95));
    const page=doc.addPage([outputViewport.width,outputViewport.height]);
    page.drawImage(image,{x:0,y:0,width:outputViewport.width,height:outputViewport.height});
    canvas.width=canvas.height=1;
  }
  return doc;
}
async function savePdf(){
  if(!pdfBytes)return;commitAllText();commitAllTables();const{rgb,degrees}=PDFLib;const saveBtn=document.getElementById('saveBtn');saveBtn.disabled=true;
  try{const doc=await createPasswordFreeDocument();const pages=doc.getPages();
  for(let pn=1;pn<=totalPages;pn++){
    const pg=pages[pn-1];const rot=pageRotations[pn]||0;if(rot)pg.setRotation(degrees(rot));
    const anns=getAnns(pn);if(!anns.length)continue;
    const{width:pW,height:pH}=pg.getSize();const pr=pg.getRotation().angle;
    const ppg=await pdfDoc.getPage(pn);const vp=ppg.getViewport({scale,rotation:pageRotations[pn]||0});
    let eW=pW,eH=pH;const tr=((pr+rot)%360+360)%360;if(tr===90||tr===270){eW=pH;eH=pW}
    const sx=eW/vp.width,sy=eH/vp.height;
    for(const a of anns){
      if(a.type==='path'){const c=hexRgb(a.color);for(let i=1;i<a.points.length;i++)pg.drawLine({start:{x:a.points[i-1].x*sx,y:eH-a.points[i-1].y*sy},end:{x:a.points[i].x*sx,y:eH-a.points[i].y*sy},thickness:a.size*sx,color:rgb(c.r,c.g,c.b),opacity:a.alpha||1})}
      else if(a.type==='rect'){const c=hexRgb(a.color);pg.drawRectangle({x:a.x*sx,y:eH-(a.y+a.h)*sy,width:a.w*sx,height:a.h*sy,borderColor:rgb(c.r,c.g,c.b),borderWidth:a.size*sx,opacity:a.alpha||1})}
      else if(a.type==='circle'){const c=hexRgb(a.color);pg.drawEllipse({x:a.cx*sx,y:eH-a.cy*sy,xScale:Math.abs(a.rx)*sx,yScale:Math.abs(a.ry)*sy,borderColor:rgb(c.r,c.g,c.b),borderWidth:a.size*sx,opacity:a.alpha||1})}
      else if(a.type==='line'){const c=hexRgb(a.color);pg.drawLine({start:{x:a.x1*sx,y:eH-a.y1*sy},end:{x:a.x2*sx,y:eH-a.y2*sy},thickness:a.size*sx,color:rgb(c.r,c.g,c.b),opacity:a.alpha||1})}
      else if(a.type==='arrow'){const c=hexRgb(a.color);pg.drawLine({start:{x:a.x1*sx,y:eH-a.y1*sy},end:{x:a.x2*sx,y:eH-a.y2*sy},thickness:a.size*sx,color:rgb(c.r,c.g,c.b),opacity:a.alpha||1});
        const hl=Math.max(a.size*4,12)*sx,ang=Math.atan2(-(a.y2-a.y1)*sy,(a.x2-a.x1)*sx),tx=a.x2*sx,ty=eH-a.y2*sy;
        pg.drawLine({start:{x:tx,y:ty},end:{x:tx-hl*Math.cos(ang-Math.PI/6),y:ty-hl*Math.sin(ang-Math.PI/6)},thickness:a.size*sx,color:rgb(c.r,c.g,c.b),opacity:a.alpha||1});
        pg.drawLine({start:{x:tx,y:ty},end:{x:tx-hl*Math.cos(ang+Math.PI/6),y:ty-hl*Math.sin(ang+Math.PI/6)},thickness:a.size*sx,color:rgb(c.r,c.g,c.b),opacity:a.alpha||1})}
      else if(a.type==='text'){const c=hexRgb(a.color);const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);a.text.split('\n').forEach((l,i)=>pg.drawText(l,{x:a.x*sx,y:eH-(a.y+i*a.fontSize*1.2)*sy,size:a.fontSize*sy,font,color:rgb(c.r,c.g,c.b)}))}
      else if(a.type==='whiteblock'){pg.drawRectangle({x:a.x*sx,y:eH-(a.y+a.h)*sy,width:a.w*sx,height:a.h*sy,color:rgb(1,1,1),borderWidth:0})}
      else if(a.type==='table'){
        const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
        const tw=a.colWidths.reduce((s,v)=>s+v,0),th=a.rowHeights.reduce((s,v)=>s+v,0);
        pg.drawRectangle({x:a.x*sx,y:eH-(a.y+th)*sy,width:tw*sx,height:th*sy,color:rgb(1,1,1),borderColor:rgb(0,0,0),borderWidth:1*sx});
        let cy=a.y;
        for(let r=0;r<a.rows;r++){let cx=a.x;
          for(let c=0;c<a.cols;c++){
            pg.drawRectangle({x:cx*sx,y:eH-(cy+a.rowHeights[r])*sy,width:a.colWidths[c]*sx,height:a.rowHeights[r]*sy,borderColor:rgb(0,0,0),borderWidth:1*sx});
            const txt=a.cells[r]&&a.cells[r][c]?a.cells[r][c]:'';
            if(txt){const fs=(a.fontSize||13)*sy;txt.split('\n').forEach((l,li)=>pg.drawText(l,{x:(cx+4)*sx,y:eH-(cy+4+(a.fontSize||13)+li*(a.fontSize||13)*1.3)*sy,size:fs,font,color:rgb(0,0,0),maxWidth:(a.colWidths[c]-8)*sx}))}
            cx+=a.colWidths[c];}cy+=a.rowHeights[r];}
      }
    }
  }
  const saved=await doc.save();const url=URL.createObjectURL(new Blob([saved],{type:'application/pdf'}));
  const lnk=document.createElement('a');lnk.href=url;lnk.download=fileName.replace('.pdf','')+'_edited.pdf';lnk.click();URL.revokeObjectURL(url);
  }catch(err){alert('Save error: '+err.message)}finally{saveBtn.disabled=false}
}
function hexRgb(h){return{r:parseInt(h.slice(1,3),16)/255,g:parseInt(h.slice(3,5),16)/255,b:parseInt(h.slice(5,7),16)/255}}

// ══════ Font Inspection ══════
const _fontNameCache=new Map(); // internal font id -> real font name
function resolveFontName(pg,internalId){
  if(_fontNameCache.has(internalId))return _fontNameCache.get(internalId);
  let name=internalId;
  try{if(pg.commonObjs.has(internalId)){const f=pg.commonObjs.get(internalId);if(f&&f.name)name=f.name}}catch(_){}
  _fontNameCache.set(internalId,name);
  return name;
}
// Embedded subsets are prefixed like "ABCDEE+" — strip it for the family name.
function prettyFont(raw){const m=/^[A-Z]{6}\+(.+)$/.exec(raw||'');return m?m[1]:(raw||'Unknown')}
function isSubset(raw){return /^[A-Z]{6}\+/.test(raw||'')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let _fontTip=null;
function showFontInfo(ev,raw,pt,sample){
  hideFontInfo();
  const tip=document.createElement('div');tip.className='font-tip';
  const fam=prettyFont(raw);
  tip.innerHTML=`<div class="ft-fam">${escapeHtml(fam)}</div>
    <div class="ft-meta">~${pt||'?'} pt${isSubset(raw)?' · embedded subset':''}</div>
    <div class="ft-raw">${escapeHtml(raw)}</div>`;
  document.body.appendChild(tip);
  const x=Math.min(ev.clientX+14,window.innerWidth-tip.offsetWidth-8);
  const y=Math.min(ev.clientY+14,window.innerHeight-tip.offsetHeight-8);
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
  _fontTip=tip;
}
function hideFontInfo(){if(_fontTip){_fontTip.remove();_fontTip=null}}

async function scanFonts(){
  const fonts=new Map(); // family -> {count, subset, raws:Set}
  for(let pn=1;pn<=totalPages;pn++){
    const pg=await pdfDoc.getPage(pn);
    const tc=await pg.getTextContent();
    for(const it of tc.items){
      if(!it.str||!it.fontName)continue;
      const raw=resolveFontName(pg,it.fontName);
      const fam=prettyFont(raw);
      let rec=fonts.get(fam);
      if(!rec){rec={count:0,subset:isSubset(raw),raws:new Set()};fonts.set(fam,rec)}
      rec.count+=it.str.length;rec.raws.add(raw);
    }
  }
  return fonts;
}
function showAllFonts(){
  if(!pdfDoc)return;
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal" style="width:520px;max-width:92vw">
    <div class="modal-header"><h3>Fonts in Document</h3><button class="btn-close">&times;</button></div>
    <div class="modal-body"><div id="fontListBody" style="font-size:13px;color:var(--text-dim)">Scanning all pages…</div></div>
    <div class="modal-footer"><button class="btn" id="fontListClose">Close</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.querySelector('.btn-close').onclick=close;
  overlay.querySelector('#fontListClose').onclick=close;
  overlay.addEventListener('mousedown',e=>{if(e.target===overlay)close()});
  scanFonts().then(fonts=>{
    const body=overlay.querySelector('#fontListBody');if(!body)return;
    if(!fonts.size){body.textContent='No text fonts found — this PDF may be scanned images (no selectable text).';return}
    const arr=[...fonts.entries()].sort((a,b)=>b[1].count-a[1].count);
    body.innerHTML=`<div style="margin-bottom:10px">${arr.length} font${arr.length!==1?'s':''} used:</div><div class="font-list">`+
      arr.map(([fam,rec])=>`<div class="font-row">
        <div class="font-sample">${escapeHtml(fam)}</div>
        <div class="font-info">${rec.subset?'<span class="fi-badge">embedded subset</span> · ':''}${rec.count.toLocaleString()} chars</div>
      </div>`).join('')+'</div>';
  }).catch(err=>{const body=overlay.querySelector('#fontListBody');if(body)body.textContent='Error scanning fonts: '+err.message});
}

// ══════ Search ══════
let searchResults=[], searchIdx=-1, searchHls=[];

function openSearch(){
  const inp=document.getElementById('searchInput');inp.focus();inp.select();
}
function closeSearch(){
  clearSearchHighlights();searchResults=[];searchIdx=-1;
  document.getElementById('searchInfo').textContent='';
  document.getElementById('searchInput').value='';
  document.getElementById('searchInput').blur();
}
function clearSearchHighlights(){searchHls.forEach(h=>h.remove());searchHls=[]}

document.getElementById('searchInput').addEventListener('input',()=>doSearch());
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();searchNav(e.shiftKey?-1:1)}
  if(e.key==='Escape'){e.preventDefault();closeSearch()}
});

async function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  clearSearchHighlights();searchResults=[];searchIdx=-1;
  if(!q||!pdfDoc){document.getElementById('searchInfo').textContent='';return}

  for(const entry of pageElements){
    const spans=entry.textLayer.querySelectorAll('span');
    // Build full text per text layer for cross-span matching
    let fullText='';const spanMap=[];
    spans.forEach(sp=>{
      const start=fullText.length;
      fullText+=sp.textContent;
      spanMap.push({span:sp,start,end:fullText.length});
    });

    const lower=fullText.toLowerCase();
    let pos=0;
    while((pos=lower.indexOf(q,pos))!==-1){
      // Find which spans this match overlaps
      const matchEnd=pos+q.length;
      for(const sm of spanMap){
        if(sm.end<=pos||sm.start>=matchEnd)continue;
        // Partial match within this span
        const sp=sm.span;
        const rect=sp.getBoundingClientRect();
        const wrapRect=entry.wrapper.getBoundingClientRect();
        // Approximate character-level positioning
        const text=sp.textContent;
        const spStart=Math.max(0,pos-sm.start);
        const spEnd=Math.min(text.length,matchEnd-sm.start);
        const charW=rect.width/Math.max(text.length,1);

        const hl=document.createElement('div');hl.className='search-hl';
        hl.style.left=(rect.left-wrapRect.left+spStart*charW)+'px';
        hl.style.top=(rect.top-wrapRect.top)+'px';
        hl.style.width=((spEnd-spStart)*charW)+'px';
        hl.style.height=rect.height+'px';
        entry.wrapper.appendChild(hl);
        searchHls.push(hl);
        searchResults.push({hl,pageNum:entry.pageNum});
      }
      pos++;
    }
  }

  document.getElementById('searchInfo').textContent=searchResults.length?`${searchResults.length} found`:'No results';
  if(searchResults.length){searchIdx=0;highlightCurrent()}
}

function highlightCurrent(){
  searchHls.forEach(h=>h.classList.remove('active'));
  if(searchIdx>=0&&searchIdx<searchResults.length){
    const r=searchResults[searchIdx];
    r.hl.classList.add('active');
    r.hl.scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('searchInfo').textContent=`${searchIdx+1}/${searchResults.length}`;
  }
}

function searchNav(dir){
  if(!searchResults.length)return;
  searchIdx=(searchIdx+dir+searchResults.length)%searchResults.length;
  highlightCurrent();
}

// ══════ Password Modal ══════
function showPasswordModal(msg,onSubmit){
  _pwCallback=onSubmit;
  document.getElementById('pwModalMsg').textContent=msg;
  document.getElementById('pwInput').value='';
  document.getElementById('pwModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('pwInput').focus(),50);
}
function _cancelPassword(){
  document.getElementById('pwModal').classList.add('hidden');
  _pwCallback=null;
  if(_pwLoadingTask){_pwLoadingTask.destroy();_pwLoadingTask=null;}
  if(!pdfDoc)document.getElementById('fileName').textContent='No file loaded';
}
document.getElementById('pwSubmitBtn').addEventListener('click',()=>{
  const pw=document.getElementById('pwInput').value;
  document.getElementById('pwModal').classList.add('hidden');
  if(_pwCallback){const cb=_pwCallback;_pwCallback=null;cb(pw);}
});
document.getElementById('pwCancelBtn').addEventListener('click',_cancelPassword);
document.getElementById('pwModalClose').addEventListener('click',_cancelPassword);
document.getElementById('pwInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();document.getElementById('pwSubmitBtn').click();}
  if(e.key==='Escape'){e.preventDefault();_cancelPassword();}
});

// ══════ Drag & Drop ══════
document.body.addEventListener('dragover',e=>{e.preventDefault();document.getElementById('dropzoneBox')?.classList.add('dragover')});
document.body.addEventListener('dragleave',()=>document.getElementById('dropzoneBox')?.classList.remove('dragover'));
document.body.addEventListener('drop',e=>{e.preventDefault();document.getElementById('dropzoneBox')?.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});

// ══════ Keyboard ══════
document.addEventListener('keydown',e=>{
  // Allow Ctrl+F globally (even in inputs for re-focus)
  if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();openSearch();return}
  if(e.target.contentEditable==='true'||e.target.tagName==='INPUT')return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();deleteAnn(sel.entry,sel.index);return}
  if(e.key==='Enter'&&sel){const a=getAnns(sel.entry.pageNum)[sel.index];if(a&&a.type==='text'){e.preventDefault();editText(sel.entry,sel.index)}return}
  if(e.key==='Escape'){clearSel();closeSearch();closeOrganizer();_cancelPassword();hideFontInfo();return}
  if(e.ctrlKey||e.metaKey){if(e.key==='z'){e.preventDefault();undoLast()}if(e.key==='s'){e.preventDefault();savePdf()}if(e.key==='o'){e.preventDefault();openFile()}if(e.key==='='){e.preventDefault();zoomIn()}if(e.key==='-'){e.preventDefault();zoomOut()}return}
  if(e.code==='Space'&&!e.repeat&&currentTool!=='hand'){e.preventDefault();prevToolBeforeSpace=currentTool;setTool('hand');return}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();scrollToPage(currentPage-1)}
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();scrollToPage(currentPage+1)}
  if(e.key==='Home'){e.preventDefault();scrollToPage(1)} if(e.key==='End'){e.preventDefault();scrollToPage(totalPages)}
  if(e.key==='h')setTool('hand');if(e.key==='v')setTool('select');if(e.key==='t')setTool('text');if(e.key==='d')setTool('draw');
  if(e.key==='r')setTool('rect');if(e.key==='e')setTool('erase');if(e.key==='c')setTool('circle');if(e.key==='l')setTool('line');if(e.key==='a')setTool('arrow');
  if(e.key==='w')setTool('whiteblock');if(e.key==='b')setTool('table');
  if(e.key==='f')setTool('font');
});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&prevToolBeforeSpace!==null){setTool(prevToolBeforeSpace);prevToolBeforeSpace=null}});
</script>
